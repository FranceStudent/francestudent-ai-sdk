name: Publish
run-name: Publishing the package to NPM

on:
    release:
        types: [released]

jobs:
    publish-npm:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  registry-url: https://registry.npmjs.org/

            - run: npm install

            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.npm_token}}
